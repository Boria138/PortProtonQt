name: Build vk_gpu_info on Debian 11

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - scripts
    paths:
      - 'build-aux/vk_gpu_info.c'
      - '.gitea/workflows/build-vk-gpu-info-debian.yml'

jobs:
  build-debian11:
    name: Build vk_gpu_info on Debian 11
    runs-on: ubuntu-latest
    container:
      image: debian:11
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libvulkan-dev git curl wget nodejs npm

      - name: Set up Node.js
        uses: https://git.linux-gaming.ru/actions/setup-node@v2
        with:
          node-version: 20

      - name: Checkout code
        uses: https://git.linux-gaming.ru/actions/checkout@v3

      - name: Compile vk_gpu_info
        run: |
          cd build-aux
          gcc -o vk_gpu_info vk_gpu_info.c -lvulkan

      - name: Test vk_gpu_info execution
        run: |
          cd build-aux
          # Check if the executable was created
          if [ -f "./vk_gpu_info" ]; then
            echo "vk_gpu_info executable created successfully"
            # Try to run it (may fail if no Vulkan devices present, but that's OK for build test)
            timeout 10s ./vk_gpu_info || echo "vk_gpu_info ran but may have failed due to lack of Vulkan hardware (expected in CI)"
          else
            echo "ERROR: vk_gpu_info executable was not created"
            exit 1
          fi

      - name: Upload vk_gpu_info binary
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: vk_gpu_info-debian11-binary
          path: build-aux/vk_gpu_info
