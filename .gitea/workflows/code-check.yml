name: Code check

on:
  pull_request:
    branches: [main, scripts]
    paths-ignore:
      - "data/**"
      - "*.md"
      - "dev-scripts/**"
      - "portprotonqt/locales/**"
  push:
    branches: [main, scripts]
    paths-ignore:
      - "data/**"
      - "*.md"
      - "dev-scripts/**"
      - "portprotonqt/locales/**"
  workflow_dispatch:

jobs:
  pre-commit:
    name: Check code
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    steps:
      - name: Configure Arch mirror
        run: |
          echo 'Server = https://cdn.lenuma.ru/archlinux-mirror/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          sed -i -E 's/^#?[[:space:]]*ParallelDownloads[[:space:]]*=.*/ParallelDownloads = 5/' /etc/pacman.conf

      - name: Install CI dependencies
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm

      - uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install project and check dependencies
        shell: bash
        run: |
          source build-aux/PKGBUILD-git
          pacman -S --noconfirm --needed "${depends[@]}" python-qrcode libpulse mesa pre-commit pyright python-pytest python-pytest-mock
          pacman -Scc --noconfirm

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
