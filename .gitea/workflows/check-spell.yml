name: Check Translations
run-name: Check spelling in translation files
on:
  push:
    branches: [main, scripts]
    paths:
      - 'portprotonqt/locales/**'
  pull_request:
    paths:
      - 'portprotonqt/locales/**'
  workflow_dispatch:

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://git.linux-gaming.ru/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: https://git.linux-gaming.ru/actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install Python dependencies
        run: pip install pyaspeller babel

      - name: Run spell check
        run: |
          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            base="${{ gitea.event.pull_request.base.sha }}"
          else
            base="${{ gitea.event.before }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            python dev-scripts/l10n.py --spellcheck
          else
            python dev-scripts/l10n.py --spellcheck --changed-since "$base" --changed-to "${{ gitea.sha }}"
          fi
