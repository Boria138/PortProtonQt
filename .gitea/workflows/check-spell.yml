name: Check Translations
run-name: Check spelling in translation files
on:
  push:
    branches: [main]
    paths:
      - 'portprotonqt/locales/**'
  pull_request:
    paths:
      - 'portprotonqt/locales/**'
  workflow_dispatch:

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: https://gitea.com/actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install Python dependencies
        run: pip install pyaspeller babel

      - name: Run spell check
        run: python dev-scripts/l10n.py --spellcheck
